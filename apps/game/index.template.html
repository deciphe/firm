<title>FIRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-thumb phone terminal. HUD on top, the book (5x4 grid) in the middle, the decision dock at the bottom.
   Committed single dark look: a perp-DEX terminal at night with chunky pixel things on it. */
:root {
  --bg: #07100d;
  --panel: #0c1815;
  --panel-2: #11211d;
  --line: #1c312b;
  --ink: #d6ece3;
  --dim: #8aa79c;
  --mint: #45e6a8;
  --red: #ff4b5c;
  --amber: #ffc145;
  --blue: #6aa9ff;
  --font-pixel: 'Silkscreen', 'Courier New', monospace;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 6px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.35 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .4; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  position: relative;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.eyebrow { margin: 0; font: 400 10.5px/1 var(--font-pixel); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }

/* HUD */
.top { display: flex; align-items: baseline; gap: 10px; }
.brand { font: 700 20px/1 var(--font-pixel); letter-spacing: .02em; color: var(--mint); }
.firm { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.firm b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.firm small { color: var(--dim); font-size: 11px; }
.tiny-btn { font: 400 10.5px/1 var(--font-pixel); color: var(--dim); padding: 8px 6px; border: 1px solid var(--line); border-radius: var(--r); min-height: 32px; }
.stats { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .v { font: 600 18px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.stat small { color: var(--dim); font: 400 10.5px/1 var(--font-num); }
#cash-box .v { font-size: 22px; color: var(--mint); }
#cash-box.fire { animation: fire .18s steps(2) infinite; border-color: var(--amber); }
#cash-box.fire .v { color: var(--amber); text-shadow: 0 0 10px rgba(255,193,69,.6), 0 -3px 12px rgba(255,75,92,.5); }
@keyframes fire { 50% { box-shadow: 0 -4px 18px rgba(255,140,60,.35) inset; } }
.meter { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--blue); transition: width .3s ease-out; }
#heat-box .meter b { background: var(--amber); }
#heat-box.hot .meter b { background: var(--red); }
#heat-box.hot .v { color: var(--red); }

.payroll { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px; }
.payroll .lbl { font: 400 10.5px/1 var(--font-pixel); color: var(--dim); text-transform: uppercase; }
.payroll .amt { font: 600 15px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.payroll .when { color: var(--dim); font: 400 11px/1 var(--font-num); text-align: right; }
.payroll .meter { grid-column: 1 / -1; height: 8px; }
.payroll .meter b { background: var(--mint); }
.payroll.short .meter b { background: var(--amber); }
.payroll.danger .meter b { background: var(--red); }
.payroll.danger { border-color: rgba(255,75,92,.6); }
.payroll .gap { grid-column: 1 / -1; font: 400 11px/1 var(--font-num); color: var(--mint); }
.payroll.short .gap { color: var(--amber); }
.payroll.danger .gap { color: var(--red); }
#loan-note { grid-column: 1 / -1; font: 400 11px/1.2 var(--font-num); color: var(--amber); }

/* Tape + forecast */
.tapebox { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tape { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; position: relative; }
.tape-empty { font: 400 11px/26px var(--font-num); color: var(--dim); }
#tape-strip { display: flex; gap: 3px; align-items: flex-end; height: 26px; overflow: hidden; }
.candle { display: block; width: 6px; border-radius: 1px; }
.c-chop.candle { height: 8px; background: var(--dim); }
.c-up.candle { height: 22px; background: var(--mint); }
.c-down.candle { height: 22px; background: var(--red); }
.c-news.candle { height: 26px; background: var(--amber); }
#forecast { display: grid; grid-template-columns: repeat(2, auto); gap: 3px 8px; }
.fc { position: relative; display: block; min-width: 84px; height: 15px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.fc b { position: absolute; inset: 0 auto 0 0; opacity: .35; }
.fc em { position: relative; font: normal 400 10.5px/15px var(--font-num); padding-left: 5px; color: var(--ink); }
.f-chop b { background: var(--dim); } .f-up b { background: var(--mint); } .f-down b { background: var(--red); } .f-news b { background: var(--amber); }

/* The book */
.board { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; position: relative; container-type: size; }
#grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; height: min(100cqh, calc(100cqw * 0.864 + 18px)); }
.tile {
  position: relative; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 2px 8px; min-width: 0;
}
.tile img { width: 32px; height: 32px; image-rendering: pixelated; }
.tname { font: 600 10.5px/1.1 var(--font-body); text-align: center; color: var(--ink); max-width: 100%; word-break: keep-all; overflow-wrap: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@container (max-height: 300px) { .tile img { width: 24px; height: 24px; } .tile { gap: 1px; padding-bottom: 7px; } }
.tile.staff { border-color: rgba(106,169,255,.45); background: linear-gradient(var(--panel), #0d1a22); }
.tile.staff .tname { color: var(--blue); }
.tile.exposed { border-color: var(--red); }
.tile.exposed .tname { color: var(--red); }
.tile.due { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.tile.empty { background: transparent; border-style: dashed; }
.slot-plus { color: var(--line); font: 400 16px/1 var(--font-pixel); }
.prog { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.prog b { display: block; height: 100%; background: var(--amber); }
.bonus { position: absolute; top: 3px; right: 4px; font: 600 10.5px/1 var(--font-num); color: var(--mint); }
.float { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font: 600 13px/1 var(--font-num); white-space: nowrap; pointer-events: none; z-index: 3; text-shadow: 0 1px 0 #000; }
.float.pos { color: var(--mint); } .float.neg { color: var(--red); }
.float { background: rgba(7,16,13,.85); padding: 2px 4px; border-radius: 3px; }
#grid.placing .tile { border-color: rgba(69,230,168,.35); }
#grid.placing .tile.empty { border-color: var(--mint); border-style: dashed; animation: pulse 1s ease-in-out infinite; }
#grid.placing .tile.empty .slot-plus { color: var(--mint); }
@keyframes pulse { 50% { background: rgba(69,230,168,.08); } }

.reveal { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(7,16,13,.82); z-index: 4; border-radius: var(--r); pointer-events: none; }
.reveal.on { display: flex; }
.big-candle { display: block; width: 18px; height: 40px; background: var(--dim); border-radius: 2px; position: relative; image-rendering: pixelated; }
.big-candle::before { content: ''; position: absolute; left: 50%; top: -14px; bottom: -14px; width: 2px; transform: translateX(-50%); background: inherit; z-index: -1; }
.reveal span { font: 700 16px/1 var(--font-pixel); letter-spacing: .04em; }
.reveal.c-up .big-candle { background: var(--mint); } .reveal.c-up span { color: var(--mint); }
.reveal.c-down .big-candle { background: var(--red); } .reveal.c-down span { color: var(--red); }
.reveal.c-news .big-candle { background: var(--amber); } .reveal.c-news span { color: var(--amber); }
.reveal.c-chop span { color: var(--ink); }

.banner { position: absolute; left: 0; right: 0; top: -2px; text-align: center; font: 700 13px/1 var(--font-pixel); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
.banner.on { opacity: 1; }
.banner.good { color: var(--mint); } .banner.bad { color: var(--red); }

/* Feed */
#feed { display: flex; flex-direction: column; gap: 3px; min-height: 34px; }
.post { margin: 0; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post b { font-weight: 600; color: var(--ink); }
.post.t-bad b { color: var(--red); } .post.t-good b { color: var(--mint); }

/* Hand */
.handrow { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.handrow .eyebrow { flex: none; }
#hand { display: flex; gap: 6px; }
.chip { flex: none; font: 400 11px/1 var(--font-num); padding: 5px 7px; border-radius: 99px; border: 1px solid rgba(255,75,92,.4); color: #ffb3ba; white-space: nowrap; }
.chip.none { border-color: var(--line); color: var(--dim); }

/* Dock */
#dock { display: flex; flex-direction: column; gap: 8px; }
.primary { width: 100%; min-height: 60px; border-radius: var(--r); background: var(--mint); color: #04130d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #1f8f63; }
.primary span { font: 700 17px/1 var(--font-pixel); letter-spacing: .03em; }
.primary small { font: 600 11px/1 var(--font-num); opacity: .75; }
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #1f8f63; }
body.busy .primary { opacity: .5; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-height: 52px; display: flex; flex-direction: column; gap: 3px; }
.move b { font: 400 11.5px/1 var(--font-pixel); color: var(--amber); text-transform: uppercase; }
.move small { font-size: 11px; color: var(--dim); line-height: 1.25; }
.dhint { margin: 0; font-size: 12px; color: var(--dim); }
.offers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.offer { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 8px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 132px; }
.offer img { width: 32px; height: 32px; image-rendering: pixelated; }
.offer b { font-size: 12.5px; font-weight: 600; line-height: 1.15; }
.offer small { font-size: 11px; line-height: 1.25; color: var(--dim); }
.otag { position: absolute; top: 7px; left: 8px; font: 400 10.5px/1 var(--font-pixel); color: var(--dim); text-transform: uppercase; }
.offer.r-uncommon { border-color: rgba(106,169,255,.5); }
.offer.r-rare { border-color: var(--amber); box-shadow: 0 0 12px rgba(255,193,69,.18) inset; }
.offer.r-excuse { border-color: rgba(255,75,92,.4); }
.offer.sel { border-color: var(--mint); box-shadow: 0 0 0 2px var(--mint) inset; }
.drow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghost-btn { min-height: 44px; border: 1px solid var(--line); border-radius: var(--r); font: 400 12px/1 var(--font-pixel); color: var(--ink); text-transform: uppercase; }

/* Overlays */
.scrim { position: fixed; inset: 0; background: rgba(2,6,5,.78); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet { width: 100%; max-width: 480px; box-sizing: border-box; background: var(--panel); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; }
.pcard { position: relative; display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto; gap: 6px 12px; align-items: center; background: var(--panel-2); border: 1px solid var(--amber); border-radius: var(--r); padding: 12px; perspective: 600px; }
.pcard.exposed { border-color: var(--red); }
.pcard img { width: 64px; height: 64px; image-rendering: pixelated; grid-row: span 2; }
.pname { font-size: 16px; font-weight: 600; display: block; }
.pmeta { display: block; font-size: 11.5px; color: var(--dim); }
.evidence { display: block; margin-top: 4px; font-size: 11.5px; color: var(--red); }
.pamt { grid-column: 2; font: 600 30px/1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--amber); }
.consequence { margin: 0; font: 400 12px/1.4 var(--font-num); color: var(--dim); }
.consequence b { color: var(--ink); }
.consequence.warn b { color: var(--red); }
.pact { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.pay { min-height: 52px; border-radius: var(--r); background: var(--mint); color: #04130d; font: 700 15px/1 var(--font-pixel); text-transform: uppercase; }
.stall { min-height: 52px; border-radius: var(--r); border: 1px solid var(--line); font: 400 12px/1 var(--font-pixel); text-transform: uppercase; }
.excuses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.excuse { text-align: left; border: 1px solid rgba(255,75,92,.4); border-radius: var(--r); padding: 8px 10px; min-height: 48px; display: flex; flex-direction: column; gap: 3px; }
.excuse b { font-size: 12.5px; color: #ffb3ba; }
.excuse small { font-size: 11px; color: var(--dim); line-height: 1.25; }
.noex { margin: 0; color: var(--dim); font-size: 12px; }
.ghost-them { min-height: 44px; border-radius: var(--r); color: var(--red); font: 400 12px/1 var(--font-pixel); text-transform: uppercase; display: flex; gap: 8px; justify-content: center; align-items: center; }
.ghost-them small { font: 400 11px/1 var(--font-body); color: var(--dim); text-transform: none; }
.stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-14deg); font: 700 28px/1 var(--font-pixel); padding: 6px 12px; border: 3px solid currentColor; border-radius: 4px; pointer-events: none; background: rgba(7,16,13,.6); }
.stamp.ok { color: var(--mint); } .stamp.no { color: var(--red); }

.sheet.small p { margin: 0; color: var(--ink); }
.irow { display: flex; gap: 12px; align-items: center; }
.irow img { width: 48px; height: 48px; image-rendering: pixelated; }
.irow b { display: block; font-size: 16px; }
.irow small { color: var(--dim); }
dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font: 400 12px/1.2 var(--font-num); }
dt { color: var(--dim); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

#death { align-items: center; }
.dcard { width: calc(100% - 32px); max-width: 420px; background: var(--panel); border: 1px solid var(--red); border-radius: 10px; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 4px rgba(255,75,92,.12); }
.dcard h2 { margin: 0; font: 700 24px/1.1 var(--font-pixel); color: var(--ink); text-wrap: balance; }
.cause { margin: 0; font-size: 16px; font-weight: 600; color: var(--red); display: flex; flex-direction: column; gap: 2px; }
.cause span { font: 600 13px/1 var(--font-num); color: var(--amber); }
.dstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dstats div { background: var(--panel-2); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dstats small { color: var(--dim); font-size: 10.5px; }
.dstats b { font: 600 16px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.best { margin: 0; font: 400 12px/1 var(--font-num); color: var(--mint); }

#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); font: 600 12px/1.3 var(--font-body); padding: 9px 12px; border-radius: 99px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 40; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-height: 700px) {
  #app { gap: 7px; padding-block: 6px; }
  .offer { min-height: 112px; padding-top: 20px; }
  .offer small { display: none; }
  .primary { min-height: 52px; }
  .move { min-height: 46px; }
  #feed { min-height: 0; }
  .post:nth-child(2) { display: none; }
  .dhint { display: none; }
  .move small { display: none; }
  .stat .v { font-size: 16px; }
  #cash-box .v { font-size: 19px; }
  .stats small#trust-mult, #heat-note { display: none; }
  .payroll { padding: 6px 10px; }
  .handrow { display: none; }
  .tapebox .eyebrow { display: none; }
  .fc { min-width: 70px; }
}
</style>

<div id="app">
  <div class="top">
    <span class="brand">FIRM</span>
    <div class="firm"><b id="firm-name">Firm</b><small><span id="day">Day 1</span> · <span id="mode">Free run</span></small></div>
    <button class="tiny-btn" id="new-run">New</button>
    <button class="tiny-btn" id="mute" aria-pressed="true">Sound on</button>
  </div>

  <div class="stats">
    <div class="stat" id="cash-box"><small>Cash</small><span class="v num" id="cash">$0</span></div>
    <div class="stat"><small>Trust</small><span class="v num" id="trust">3.0</span><span class="meter"><b id="trust-fill"></b></span><small id="trust-mult"></small></div>
    <div class="stat" id="heat-box"><small>Heat</small><span class="v num" id="heat">0</span><span class="meter"><b id="heat-fill"></b></span><small id="heat-note">safe</small></div>
  </div>

  <div class="payroll" id="payroll">
    <span class="lbl">Payroll</span>
    <span class="amt" id="payroll-amt">$0</span>
    <span class="when" id="payroll-when"></span>
    <span class="meter"><b id="payroll-fill"></b></span>
    <span class="gap" id="payroll-gap"></span>
    <span id="loan-note" hidden></span>
  </div>

  <div class="tape">
    <div class="tapebox"><span class="eyebrow">Tape</span><div id="tape-strip" aria-label="Recent candles"></div></div>
    <div class="tapebox"><span class="eyebrow">Next candle odds</span><div id="forecast" aria-label="Next candle odds"></div></div>
  </div>

  <div class="board">
    <div class="banner" id="banner"></div>
    <div id="grid"></div>
    <div class="reveal" id="reveal"></div>
  </div>

  <div id="feed" aria-live="polite"></div>
  <div class="handrow"><span class="eyebrow">Excuses</span><div id="hand"></div></div>
  <div id="dock"></div>
</div>

<div class="scrim" id="payout" hidden></div>
<div class="scrim" id="info" hidden></div>
<div class="scrim" id="death" hidden></div>
<div id="toast" role="status"></div>

<script>/*__BUNDLE__*/</script>
