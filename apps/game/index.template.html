<title>FIRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Balatro's table. Left: the run panel (payroll to beat, base x mult, cash, days, rerolls).
   Centre: excuses row, the Book (a 5x4 grid of cream cards), the action bar. The shop slides up between days.
   Look: Flat MASSIVE. Cream on near-black ink, stippled lunar art, Manrope, restrained gold/platinum/bronze,
   Claude clay for the one action that matters. Committed single dark look. */
:root {
  --ink: #080809;
  --panel: #111113;
  --panel-2: #18181b;
  --line: #26262b;
  --line-2: #34343a;
  --paper: #eeeae2;
  --paper-2: #e2ddd2;
  --paper-3: #d2ccbf;
  --muted: #aaa499;
  --ink-soft: #4a463f;
  --gold: #d8c38f;
  --gold-deep: #9e8a58;
  --platinum: #c9ccd1;
  --bronze: #b0805a;
  --clay: #d97757;
  --clay-deep: #9f4f35;
  --chip: #86a9d4;
  --chip-deep: #4c6f9c;
  --font: 'Manrope', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--paper); font: 500 14px/1.4 var(--font); font-feature-settings: 'tnum' 1; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button:disabled { cursor: not-allowed; opacity: .38; }
[data-reveal].veiled { visibility: hidden; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

#game { position: relative; z-index: 1; height: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding-block: 10px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto; }

/* ---------------------------------------------------------------- run panel */
.run { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; background: rgba(17,17,19,.92); border: 1px solid var(--line); border-radius: 14px; }
.brand { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 2px 4px 4px; }
.wordmark { font: 800 15px/1 var(--font); letter-spacing: .32em; color: var(--paper); }
.firmname { flex: 1; min-width: 0; font: 600 12px/1.2 var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { flex: none; height: 30px; min-width: 30px; padding: 0 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font: 700 11px/1 var(--font); color: var(--muted); letter-spacing: .04em; }
.box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lbl { font: 700 10.5px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.big { font: 800 22px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.sub { font: 600 11.5px/1.25 var(--font); color: var(--muted); }

.payroll { grid-column: 1 / -1; background: linear-gradient(180deg, rgba(217,119,87,.12), rgba(217,119,87,.04)); border-color: rgba(217,119,87,.35); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.payroll .big { color: var(--paper); }
.payroll .due { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.daydots { display: flex; gap: 4px; }
.daydots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--clay); }
.daydots i.on { background: var(--clay); }
.track { grid-column: 1 / -1; height: 4px; background: rgba(238,234,226,.08); border-radius: 2px; overflow: hidden; }
.track b { display: block; height: 100%; background: var(--paper); border-radius: 2px; transition: width .2s ease-out; }
.payroll.short .track b { background: var(--clay); }
.payroll.danger { animation: alarm 1s steps(2) infinite; }
@keyframes alarm { 50% { border-color: var(--clay); background: rgba(217,119,87,.2); } }

.score { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 6px; }
.chipbox, .multbox { border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.chipbox { background: var(--chip); color: #0d1a2b; box-shadow: inset 0 -3px 0 var(--chip-deep); text-align: right; }
.multbox { background: var(--clay); color: #2a0e05; box-shadow: inset 0 -3px 0 var(--clay-deep); }
.chipbox .lbl, .multbox .lbl { color: inherit; opacity: .7; }
.chipbox .big, .multbox .big { font-size: 22px; }
.times { align-self: center; font: 800 18px/1 var(--font); color: var(--muted); }
.today { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px; }
.today .big { font-size: 26px; }
.today.fire .big { color: var(--gold); animation: burn .14s steps(2) infinite; text-shadow: 0 0 18px rgba(216,195,143,.6), 0 -4px 14px rgba(217,119,87,.6); }
@keyframes burn { 50% { transform: translateY(-1px) skewX(-2deg); } }

.cash .big { color: var(--gold); }
.meters { display: flex; flex-direction: column; gap: 6px; }
.meter { display: grid; grid-template-columns: 44px 1fr 30px; align-items: center; gap: 6px; font: 700 11px/1 var(--font); color: var(--muted); }
.meter .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.meter .dots i { height: 6px; border-radius: 3px; background: rgba(238,234,226,.1); }
.meter.trust .dots i.on { background: var(--platinum); }
.meter.heat .dots i.on { background: var(--bronze); }
.meter.heat.hot .dots i.on { background: var(--clay); }
.meter b { color: var(--paper); text-align: right; font-weight: 800; }
.stats4 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats4 .box { padding: 7px 8px; align-items: center; text-align: center; }
.stats4 .big { font-size: 17px; }
.runbtns { grid-column: 1 / -1; display: none; gap: 6px; }

/* ---------------------------------------------------------------- table */
.table { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; container-type: size; }
.toprow { display: flex; align-items: center; gap: 10px; min-height: 34px; min-width: 0; }
.excuses { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
.ex-chip { font: 700 11px/1 var(--font); padding: 7px 9px; border-radius: 7px; background: rgba(217,119,87,.12); border: 1px solid rgba(217,119,87,.35); color: #f2b39d; white-space: nowrap; }
.ex-chip.none { background: transparent; border-color: var(--line); color: var(--muted); }
.tape { display: flex; gap: 2px; align-items: flex-end; height: 24px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.tape .odds-txt { margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tape .odds-short { display: none; }
@media (max-width: 899px) { .tape .odds-long { display: none; } .tape .odds-short { display: inline; } }
.tape i { width: 4px; border-radius: 1px; }
.tape .c-chop { height: 6px; background: var(--muted); } .tape .c-up { height: 18px; background: var(--paper); } .tape .c-down { height: 18px; background: var(--clay); } .tape .c-news { height: 24px; background: var(--gold); }
.felt { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
#grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 7px; height: min(100%, calc(100cqw * 1.3)); width: min(100%, calc((100cqh - 42px) / 1.3)); perspective: 800px; }

.card { position: relative; min-width: 0; min-height: 0; border-radius: 9px; background: var(--paper); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 14px rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.4); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; padding: 6px 6px 7px; transform-origin: 50% 100%; animation: sway 4.8s ease-in-out infinite; animation-delay: calc(var(--i) * -0.41s); transition: transform .12s ease-out, box-shadow .12s; }
.card::after { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(8,8,9,.12); border-radius: 7px; pointer-events: none; }
@keyframes sway { 0%, 100% { transform: rotate(-.8deg) translateY(0); } 50% { transform: rotate(.8deg) translateY(-2px); } }
.card .fee { font: 800 12px/1 var(--font); letter-spacing: -0.02em; display: flex; justify-content: space-between; align-items: center; }
.card .fee small { font: 700 9px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); opacity: .75; }
.card .art { min-height: 0; display: flex; align-items: center; justify-content: center; }
.card .art img { width: 100%; max-width: 64px; aspect-ratio: 1; object-fit: contain; }
.card .nm { font: 800 10.5px/1.1 var(--font); text-align: center; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .prog { display: flex; justify-content: center; gap: 2.5px; margin-top: 5px; height: 5px; }
.card .prog i { width: 5px; height: 5px; border-radius: 50%; border: 1px solid rgba(8,8,9,.35); }
.card .prog i.on { background: var(--ink); border-color: var(--ink); }
.card.staff { background: linear-gradient(180deg, #e9e7e4, var(--paper-2)); box-shadow: 0 0 0 1.5px var(--platinum) inset, 0 6px 14px rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.4); }
.card.rare { box-shadow: 0 0 0 2px var(--gold) inset, 0 6px 14px rgba(0,0,0,.45), 0 0 18px rgba(216,195,143,.25); }
.card.due { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(216,195,143,.55), 0 6px 14px rgba(0,0,0,.45); animation: sway 4.8s ease-in-out infinite, due 1.1s ease-in-out infinite; }
@keyframes due { 50% { box-shadow: 0 0 0 2px var(--gold), 0 0 34px rgba(216,195,143,.8), 0 6px 14px rgba(0,0,0,.45); } }
.card.due .prog i.on { background: var(--gold-deep); border-color: var(--gold-deep); }
.card .stamp { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-14deg); font: 800 10px/1 var(--font); letter-spacing: .14em; color: var(--clay); border: 2px solid var(--clay); padding: 3px 5px; border-radius: 4px; background: rgba(238,234,226,.8); }
.card.exposed .art img { filter: sepia(1) saturate(4) hue-rotate(-30deg) brightness(.9); }
.card .bonus { position: absolute; top: -6px; right: -4px; font: 800 10px/1 var(--font); background: var(--gold); color: var(--ink); padding: 3px 5px; border-radius: 5px; }
.slot { border-radius: 9px; border: 1.5px dashed rgba(170,164,153,.22); display: grid; place-items: center; color: rgba(170,164,153,.35); font: 700 18px/1 var(--font); min-height: 0; }
#grid.placing .slot { border-color: var(--gold); color: var(--gold); background: rgba(216,195,143,.06); animation: slotp .9s ease-in-out infinite; }
@keyframes slotp { 50% { background: rgba(216,195,143,.14); } }
#grid.placing .card { opacity: .55; }
@media (hover: hover) { .card:hover { transform: translateY(-6px) scale(1.05); z-index: 4; box-shadow: 0 16px 28px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.4); animation-play-state: paused; } }

.pop { position: absolute; left: 50%; top: -6px; transform: translate(-50%, 0); display: flex; gap: 3px; pointer-events: none; z-index: 8; }
.pop b, .pop em { font: 800 13px/1 var(--font); font-style: normal; padding: 5px 7px; border-radius: 7px; white-space: nowrap; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.pop b { background: var(--chip); color: #0d1a2b; }
.pop em { background: var(--clay); color: #2a0e05; }
.pop.neg b { background: var(--ink); color: var(--clay); border: 1.5px solid var(--clay); }

.reveal { position: absolute; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; pointer-events: none; background: radial-gradient(closest-side, rgba(8,8,9,.88), rgba(8,8,9,.25)); }
.reveal.on { display: flex; }
.candle { position: relative; width: 30px; height: 40px; border-radius: 3px; background: var(--muted); }
.candle::before { content: ''; position: absolute; left: 50%; top: -26px; bottom: -26px; width: 3px; transform: translateX(-50%); background: inherit; border-radius: 2px; z-index: -1; }
.reveal span { font: 800 28px/1 var(--font); letter-spacing: .12em; }
.reveal small { font: 700 11px/1 var(--font); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.reveal.c-up .candle { background: var(--paper); } .reveal.c-down .candle { background: var(--clay); } .reveal.c-news .candle { background: var(--gold); }
.reveal.c-down span { color: var(--clay); } .reveal.c-news span { color: var(--gold); }

/* ---------------------------------------------------------------- action bar */
.bar { display: grid; grid-template-columns: 1fr; gap: 8px; }
.cta { height: 62px; border-radius: 14px; background: var(--clay); color: #2a0e05; box-shadow: inset 0 -4px 0 var(--clay-deep), 0 10px 30px rgba(217,119,87,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform .07s; }
.cta b { font: 800 18px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; }
.cta small { font: 700 11px/1 var(--font); opacity: .65; letter-spacing: .06em; }
.cta:active, .cta.press { transform: translateY(3px); box-shadow: inset 0 -1px 0 var(--clay-deep); }
body.busy .cta { filter: saturate(.4) brightness(.7); }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { border-radius: 12px; padding: 9px 12px; text-align: left; background: var(--panel); border: 1px solid rgba(216,195,143,.35); display: flex; flex-direction: column; gap: 3px; }
.move b { font: 800 12px/1 var(--font); color: var(--gold); letter-spacing: .08em; text-transform: uppercase; }
.move small { font: 600 11px/1.3 var(--font); color: var(--muted); }

/* ---------------------------------------------------------------- shop */
.shop { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 0 max(10px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(10px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.shop-in { pointer-events: auto; width: 100%; max-width: 560px; box-sizing: border-box; background: rgba(17,17,19,.97); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -20px 50px rgba(0,0,0,.6); }
.shop-head { display: flex; justify-content: space-between; align-items: baseline; }
.shop-head b { font: 800 14px/1 var(--font); letter-spacing: .22em; text-transform: uppercase; }
.shop-head small { font: 600 12px/1 var(--font); color: var(--muted); }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.offer { position: relative; background: var(--paper); color: var(--ink); border-radius: 12px; padding: 10px 9px 11px; display: flex; flex-direction: column; gap: 6px; text-align: left; box-shadow: 0 8px 18px rgba(0,0,0,.5); transition: transform .12s; animation: sway 4.8s ease-in-out infinite; animation-delay: calc(var(--i) * -1.3s); }
.offer::after { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(8,8,9,.12); border-radius: 9px; pointer-events: none; }
.offer .price { position: absolute; top: -9px; right: 8px; z-index: 2; font: 800 12px/1 var(--font); padding: 5px 8px; border-radius: 7px; background: var(--gold); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold-deep), 0 3px 8px rgba(0,0,0,.4); }
.offer.broke { filter: grayscale(.8) brightness(.6); }
.offer.broke .price { background: var(--panel-2); color: var(--clay); box-shadow: 0 0 0 1px var(--clay) inset; }
.offer .otag { font: 800 9px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.offer.r-uncommon .otag { color: #5d6d86; } .offer.r-rare .otag { color: var(--gold-deep); } .offer.r-excuse .otag { color: var(--clay-deep); }
.offer.r-rare { box-shadow: 0 0 0 2px var(--gold) inset, 0 8px 18px rgba(0,0,0,.5), 0 0 22px rgba(216,195,143,.25); }
.offer.r-uncommon { box-shadow: 0 0 0 1.5px var(--platinum) inset, 0 8px 18px rgba(0,0,0,.5); }
.offer img { width: 56px; height: 56px; align-self: center; }
.offer b { font: 800 13px/1.15 var(--font); }
.offer small { font: 600 11px/1.35 var(--font); color: var(--ink-soft); }
.offer.sel { transform: translateY(-10px) scale(1.03); box-shadow: 0 0 0 2.5px var(--clay), 0 16px 30px rgba(0,0,0,.6); animation: none; }
@media (hover: hover) { .offer:hover { transform: translateY(-6px); animation-play-state: paused; } }
.shop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn2 { height: 46px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); font: 800 12px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; }
.btn2.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); box-shadow: inset 0 -3px 0 var(--gold-deep); }

/* ---------------------------------------------------------------- sheets */
.scrim { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(8,8,9,.72); padding: 0 0 env(safe-area-inset-bottom, 0px); }
.sheet { width: 100%; max-width: 520px; box-sizing: border-box; max-height: 94%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.eyebrow { margin: 0; font: 700 10.5px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.req { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.req .card, .info-row .card { animation: none; height: 134px; }
.req .card .prog i, .info-row .card .prog i { width: 4px; height: 4px; }
.req .card .prog, .info-row .card .prog { gap: 2px; }
.req .who b { display: block; font: 800 18px/1.1 var(--font); }
.req .who span { display: block; margin-top: 4px; font: 600 12px/1.35 var(--font); color: var(--muted); }
.req .who .evidence { color: var(--clay); }
.req .amt { margin-top: 10px; font: 800 38px/1 var(--font); color: var(--gold); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.conseq { margin: 0; font: 600 12.5px/1.45 var(--font); color: var(--muted); }
.conseq b { color: var(--paper); } .conseq.warn b { color: var(--clay); }
.pact { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.pay { height: 54px; border-radius: 12px; background: var(--gold); color: var(--ink); font: 800 16px/1 var(--font); letter-spacing: .16em; box-shadow: inset 0 -4px 0 var(--gold-deep); }
.denies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.deny { text-align: left; border-radius: 12px; padding: 10px 12px; background: rgba(217,119,87,.08); border: 1px solid rgba(217,119,87,.32); display: flex; flex-direction: column; gap: 3px; }
.deny b { font: 800 12.5px/1.15 var(--font); color: #f2b39d; }
.deny small { font: 600 11px/1.3 var(--font); color: var(--muted); }
.ghost { height: 42px; font: 800 11px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--clay); }
.ghost small { font: 600 11px/1 var(--font); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 8px; }
.bigstamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); font: 800 30px/1 var(--font); letter-spacing: .14em; padding: 8px 14px; border: 4px solid currentColor; border-radius: 8px; background: rgba(8,8,9,.82); pointer-events: none; z-index: 5; }
.bigstamp.ok { color: var(--gold); } .bigstamp.no { color: var(--clay); }
.info-row { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.info-row .card { animation: none; height: 134px; }
.info-row b { display: block; font: 800 18px/1.15 var(--font); }
.info-row p { margin: 6px 0 0; font: 600 13px/1.45 var(--font); color: var(--paper); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font: 600 12.5px/1.2 var(--font); color: var(--muted); margin: 0; }
.kv dd { margin: 0; color: var(--paper); text-align: right; font-weight: 800; }
.how { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: how; }
.how li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font: 600 13px/1.45 var(--font); counter-increment: how; }
.how li::before { content: counter(how); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line-2); font: 800 12px/1 var(--font); color: var(--gold); }
.how b { color: var(--paper); } .how span { color: var(--muted); }
.k-chip { color: var(--chip); } .k-mult { color: var(--clay); } .k-gold { color: var(--gold); }

#death { align-items: center; }
