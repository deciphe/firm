<title>FIRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: 'FIRM Pixel'; src: url(data:font/ttf;base64,/*__FONT_REG__*/) format('truetype'); font-display: block; }
@font-face { font-family: 'FIRM Pixel Bold'; src: url(data:font/ttf;base64,/*__FONT_BOLD__*/) format('truetype'); font-display: block; }

/* Layout: the browser window is the game window. Phone = one column (signs, table, dock).
   Desktop landscape = three columns: firm sidebar | the table | the shop. Committed single dark look:
   a trading floor at night, chunky pixel cast on physical cards, crisp pixel numerals. */
:root {
  --void: #030a08;
  --plate: #0f1e1a;
  --plate-hi: #16302a;
  --edge: #24423a;
  --edge-hi: #2f5a4e;
  --ink: #e6f4ed;
  --dim: #8fb0a4;
  --mint: #45e6a8;
  --mint-deep: #138a5c;
  --red: #ff4b5c;
  --red-deep: #9c1f2d;
  --amber: #ffc145;
  --amber-deep: #a8760f;
  --blue: #6aa9ff;
  --blue-deep: #2b5ba8;
  --shadow: #010403;
  --px: 'FIRM Pixel', 'Courier New', monospace;
  --pxb: 'FIRM Pixel Bold', 'FIRM Pixel', 'Courier New', monospace;
  --s1: 10px; --s2: 15px; --s3: 20px; --s4: 30px; --s5: 40px;
  --sprite: 32px;
  --tile-name: var(--s1);
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--void); color: var(--ink); font: 400 var(--s2)/1.4 var(--px); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-font-smoothing: none; font-smooth: never; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
button:disabled { cursor: not-allowed; filter: grayscale(.7); opacity: .45; }
img.spr { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
[data-reveal].veiled { visibility: hidden; }

#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; background: radial-gradient(120% 90% at 50% 40%, #0b2a22, #020806); }
#crt { position: fixed; inset: 0; pointer-events: none; z-index: 60;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.09) 2px 3px), radial-gradient(140% 110% at 50% 50%, rgba(0,0,0,0) 65%, rgba(0,0,0,.45) 100%); }

#game {
  position: relative; z-index: 1; height: 100%; box-sizing: border-box; margin: 0 auto; max-width: 520px;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "side" "table" "dock"; gap: 10px;
  padding-block: 10px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.side { grid-area: side; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-content: start; }
.table { grid-area: table; position: relative; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
.dock { grid-area: dock; display: flex; flex-direction: column; gap: 8px; }

/* Plates: the physical UI material. Hard shadow, top highlight, no blur. */
.plate { background: linear-gradient(var(--plate-hi), var(--plate) 38%); border: 2px solid var(--edge); border-radius: 8px; box-shadow: 0 4px 0 var(--shadow), inset 0 2px 0 rgba(255,255,255,.04); }

.brand { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font: var(--s4)/1 var(--pxb); color: var(--mint); letter-spacing: 0; text-shadow: 0 3px 0 var(--mint-deep), 0 6px 0 var(--shadow); }
.firm { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.firm b { font: var(--s2)/1 var(--pxb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
.firm small { font: var(--s1)/1 var(--px); color: var(--dim); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.menu-btn { font: var(--s1)/1 var(--pxb); color: var(--dim); padding: 0 10px; min-height: 36px; min-width: 44px; text-transform: uppercase; }

.sign { padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sign .lbl { font: var(--s1)/1 var(--px); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.sign .val { font: var(--s3)/1 var(--pxb); }
#cash-box { grid-column: 1 / 2; }
#cash-box .val { color: var(--mint); text-shadow: 0 2px 0 var(--mint-deep); }
#cash-box.fire { border-color: var(--amber); animation: fire .16s steps(2) infinite; }
#cash-box.fire .val { color: var(--amber); text-shadow: 0 2px 0 var(--red-deep), 0 -2px 0 #ffe2a0; }
@keyframes fire { 50% { box-shadow: 0 4px 0 var(--shadow), inset 0 -10px 18px rgba(255,120,40,.35); } }
.pips { display: flex; gap: 2px; height: 8px; }
.pips i { flex: 1; background: #0a1613; border-radius: 1px; }
.pips i.on { background: var(--blue); box-shadow: inset 0 -2px 0 var(--blue-deep); }
#heat-box .pips i.on { background: var(--amber); box-shadow: inset 0 -2px 0 var(--amber-deep); }
#heat-box.hot .pips i.on { background: var(--red); box-shadow: inset 0 -2px 0 var(--red-deep); }
#heat-box.hot .val { color: var(--red); }
.sign small.sub { font: var(--s1)/1 var(--px); color: var(--dim); }

.payroll { grid-column: 1 / -1; padding: 8px 10px 9px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; }
.payroll .lbl { font: var(--s1)/1 var(--px); color: var(--dim); letter-spacing: .08em; }
.payroll .amt { font: var(--s3)/1 var(--pxb); }
.payroll .when { font: var(--s1)/1 var(--px); color: var(--dim); text-align: right; text-transform: uppercase; }
.bar { grid-column: 1 / -1; height: 12px; background: #081310; border: 2px solid var(--shadow); border-radius: 3px; position: relative; overflow: hidden; }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--mint); box-shadow: inset 0 -3px 0 var(--mint-deep); transition: width .25s steps(8); }
.bar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(to right, transparent 0 calc(20% - 2px), var(--shadow) calc(20% - 2px) 20%); }
.payroll.short .bar b { background: var(--amber); box-shadow: inset 0 -3px 0 var(--amber-deep); }
.payroll.danger { border-color: var(--red); animation: alarm 1s steps(2) infinite; }
.payroll.danger .bar b { background: var(--red); box-shadow: inset 0 -3px 0 var(--red-deep); }
@keyframes alarm { 50% { border-color: var(--red-deep); } }
.payroll .gap { grid-column: 1 / -1; font: var(--s1)/1 var(--px); color: var(--mint); text-transform: uppercase; letter-spacing: .05em; }
.payroll.short .gap { color: var(--amber); } .payroll.danger .gap { color: var(--red); }
#loan-note { grid-column: 1 / -1; font: var(--s1)/1.2 var(--px); color: var(--amber); }

.odds { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-width: 0; }
#tape-strip { display: flex; gap: 2px; align-items: flex-end; height: 22px; flex: 1; min-width: 0; overflow: hidden; }
.candle { flex: none; width: 6px; border: 1px solid var(--shadow); }
.candle.c-chop { height: 6px; background: var(--dim); } .candle.c-up { height: 16px; background: var(--mint); }
.candle.c-down { height: 16px; background: var(--red); } .candle.c-news { height: 20px; background: var(--amber); }
.tape-empty { font: var(--s1)/22px var(--px); color: var(--dim); text-transform: uppercase; }
#forecast { display: flex; gap: 4px; flex: none; }
.fc { font: var(--s1)/1 var(--px); padding: 4px 5px; border-radius: 3px; border: 1px solid var(--edge); background: #0a1613; display: flex; gap: 4px; align-items: center; }
.fc i { width: 6px; height: 6px; display: block; }
.f-chop i { background: var(--dim); } .f-up i { background: var(--mint); } .f-down i { background: var(--red); } .f-news i { background: var(--amber); }
.fc.top { border-color: var(--edge-hi); color: var(--ink); }

.hand, .feed { display: none; }

/* The table */
.felt { position: relative; width: 100%; height: min(100cqh, calc(100cqw * 1.12 + 24px)); display: flex; align-items: center; justify-content: center; }
#grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 7px; width: 100%; height: 100%; }
.tile { position: relative; min-height: 0; min-width: 0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 3px 10px;
  background: linear-gradient(#1a332c, #10221d 45%); border: 2px solid var(--edge); box-shadow: 0 4px 0 var(--shadow), inset 0 2px 0 rgba(255,255,255,.05);
  animation: bob 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.37s); transform-style: preserve-3d; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.tile .spr { width: var(--sprite); height: var(--sprite); filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }
.tname { font: var(--tile-name)/1.1 var(--px); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: clip; color: var(--ink); }
.tile.staff { background: linear-gradient(#182a40, #101c2c 45%); border-color: #35577f; }
.tile.staff .tname { color: #a9cbff; }
.tile.exposed { border-color: var(--red); background: linear-gradient(#3a1a20, #22121a 45%); }
.tile.exposed .tname { color: #ff9aa4; }
.tile.exposed::after { content: 'FRAUD'; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font: var(--s1)/1 var(--pxb); background: var(--red); color: #fff; padding: 2px 4px; border-radius: 3px; box-shadow: 0 2px 0 var(--shadow); }
.tile.due { border-color: var(--amber); animation: bob 3.2s ease-in-out infinite, due 0.8s steps(2) infinite; }
@keyframes due { 50% { box-shadow: 0 4px 0 var(--shadow), 0 0 0 2px var(--amber); } }
.tile.empty { background: rgba(4,12,10,.55); border: 2px dashed rgba(47,90,78,.55); box-shadow: none; animation: none; }
.slot-plus { font: var(--s3)/1 var(--px); color: rgba(143,176,164,.25); }
.seg { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 4px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; }
.seg i { background: #081310; } .seg i.on { background: var(--amber); }
.bonus { position: absolute; top: 3px; right: 4px; font: var(--s1)/1 var(--pxb); color: var(--mint); }
.chipf { position: absolute; left: 50%; top: 30%; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; z-index: 6; }
.chipf b { font: var(--s2)/1 var(--pxb); padding: 3px 5px 2px; border-radius: 4px; background: var(--mint); color: #03130d; box-shadow: 0 3px 0 var(--mint-deep), 0 5px 0 var(--shadow); white-space: nowrap; }
.chipf.neg b { background: var(--red); color: #fff; box-shadow: 0 3px 0 var(--red-deep), 0 5px 0 var(--shadow); }
.chipf em { font: var(--s1)/1 var(--pxb); font-style: normal; padding: 2px 4px; border-radius: 3px; background: var(--blue); color: #061428; box-shadow: 0 2px 0 var(--blue-deep); }
#grid.placing .tile.empty { border-color: var(--mint); background: rgba(69,230,168,.06); animation: slot 0.9s steps(2) infinite; }
#grid.placing .tile.empty .slot-plus { color: var(--mint); }
@keyframes slot { 50% { background: rgba(69,230,168,.14); } }
#grid.placing .tile:not(.empty) { opacity: .75; }

.reveal { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 8; pointer-events: none; background: radial-gradient(closest-side, rgba(3,10,8,.85), rgba(3,10,8,.4)); }
.reveal.on { display: flex; }
.big-candle { position: relative; width: 26px; height: 40px; background: var(--dim); border: 3px solid var(--shadow); box-shadow: 0 5px 0 var(--shadow); }
.big-candle::before { content: ''; position: absolute; left: 50%; top: -22px; bottom: -22px; width: 4px; transform: translateX(-50%); background: inherit; z-index: -1; border: 1px solid var(--shadow); }
.reveal span { font: var(--s4)/1 var(--pxb); text-shadow: 0 3px 0 var(--shadow); }
.reveal.c-up .big-candle { background: var(--mint); } .reveal.c-up span { color: var(--mint); }
.reveal.c-down .big-candle { background: var(--red); } .reveal.c-down span { color: var(--red); }
.reveal.c-news .big-candle { background: var(--amber); } .reveal.c-news span { color: var(--amber); }
.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none; display: none; text-align: center; padding: 14px 20px 12px; border-radius: 10px; background: rgba(3,10,8,.82); border: 2px solid var(--edge); box-shadow: 0 4px 0 var(--shadow); white-space: nowrap; }
.banner.on { display: block; }
.banner b { display: block; font: var(--s4)/1 var(--pxb); }
.banner small { display: block; margin-top: 6px; font: var(--s1)/1 var(--px); color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.banner.good b { color: var(--mint); text-shadow: 0 3px 0 var(--mint-deep), 0 6px 0 var(--shadow); }
.banner.bad b { color: var(--red); text-shadow: 0 3px 0 var(--red-deep), 0 6px 0 var(--shadow); }

/* Dock */
.primary { width: 100%; min-height: 64px; border-radius: 10px; background: linear-gradient(#6af0bf, var(--mint) 40%); color: #03130d; border: 2px solid var(--shadow); box-shadow: 0 6px 0 var(--mint-deep), 0 8px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform .06s; }
.primary span { font: var(--s3)/1 var(--pxb); letter-spacing: .04em; }
.primary small { font: var(--s1)/1 var(--px); opacity: .7; }
.primary:active, .primary.press { transform: translateY(5px); box-shadow: 0 1px 0 var(--mint-deep), 0 3px 0 var(--shadow); }
body.busy .primary { filter: saturate(.3) brightness(.7); }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { text-align: left; padding: 8px 10px; min-height: 48px; display: flex; flex-direction: column; gap: 4px; border-color: #5a4318; background: linear-gradient(#2a2312, #1a160c 45%); }
.move b { font: var(--s1)/1 var(--pxb); color: var(--amber); text-transform: uppercase; letter-spacing: .05em; font-weight: 400; }
.move small { font: var(--s1)/1.3 var(--px); color: var(--dim); }
.dhead { display: flex; justify-content: space-between; align-items: baseline; }
.dhead b { font: var(--s2)/1 var(--pxb); font-weight: 400; }
.dhead small { font: var(--s1)/1 var(--px); color: var(--dim); }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.offer { position: relative; text-align: left; padding: 9px 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 128px; transition: transform .08s; }
.offer:hover { transform: translateY(-3px); }
.offer .spr { width: 48px; height: 48px; align-self: center; filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)); }
.offer b { font: var(--s1)/1.2 var(--pxb); font-weight: 400; text-align: center; }
.offer small { font: var(--s1)/1.35 var(--px); color: var(--dim); }
.otag { font: var(--s1)/1 var(--px); color: var(--dim); text-transform: uppercase; text-align: center; letter-spacing: .06em; }
.offer.r-uncommon { border-color: #35577f; } .offer.r-uncommon .otag { color: var(--blue); }
.offer.r-rare { border-color: var(--amber); } .offer.r-rare .otag { color: var(--amber); }
.offer.r-excuse { border-color: var(--red-deep); } .offer.r-excuse .otag { color: var(--red); }
.offer.sel { border-color: var(--mint); transform: translateY(-5px); box-shadow: 0 9px 0 var(--shadow), 0 0 0 2px var(--mint); }
.drow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghost-btn { min-height: 44px; font: var(--s1)/1 var(--pxb); text-transform: uppercase; letter-spacing: .06em; }

/* Overlays */
.scrim { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(1,4,3,.72); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ticket { width: 100%; max-width: 460px; box-sizing: border-box; margin: 0 auto; border-radius: 14px 14px 0 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 94%; overflow-y: auto; background: linear-gradient(var(--plate-hi), var(--plate) 25%); border: 2px solid var(--edge); border-bottom: 0; }
.eyebrow { margin: 0; font: var(--s1)/1 var(--px); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.pcard { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; align-items: center; padding: 12px; border-radius: 10px; background: #0a1613; border: 2px solid var(--amber); box-shadow: 0 4px 0 var(--shadow); }
.pcard.exposed { border-color: var(--red); }
.pcard .spr { width: 64px; height: 64px; grid-row: span 3; }
.pname { font: var(--s2)/1 var(--pxb); }
.pmeta { font: var(--s1)/1.3 var(--px); color: var(--dim); }
.evidence { font: var(--s1)/1.3 var(--px); color: var(--red); }
.pamt { font: var(--s5)/1 var(--pxb); color: var(--amber); text-shadow: 0 3px 0 var(--amber-deep), 0 6px 0 var(--shadow); }
.consequence { margin: 0; font: var(--s1)/1.5 var(--px); color: var(--dim); }
.consequence b { color: var(--ink); font-family: var(--pxb); font-weight: 400; }
.consequence.warn b { color: var(--red); }
.pact { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px; }
.pay { min-height: 56px; border-radius: 10px; background: linear-gradient(#6af0bf, var(--mint) 40%); color: #03130d; border: 2px solid var(--shadow); box-shadow: 0 5px 0 var(--mint-deep), 0 7px 0 var(--shadow); font: var(--s3)/1 var(--pxb); }
.stall { min-height: 56px; font: var(--s1)/1 var(--pxb); text-transform: uppercase; }
.excuses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.excuse { text-align: left; padding: 8px 10px; min-height: 48px; display: flex; flex-direction: column; gap: 4px; border-color: var(--red-deep); background: linear-gradient(#2c1418, #1c0f12 45%); }
.excuse b { font: var(--s1)/1.1 var(--pxb); color: #ffb3ba; font-weight: 400; }
.excuse small { font: var(--s1)/1.3 var(--px); color: var(--dim); }
.noex { margin: 0; font: var(--s1)/1.3 var(--px); color: var(--dim); }
.ghost-them { min-height: 44px; display: flex; gap: 8px; justify-content: center; align-items: center; font: var(--s1)/1 var(--pxb); color: var(--red); text-transform: uppercase; }
.ghost-them small { font: var(--s1)/1 var(--px); color: var(--dim); text-transform: none; }
.stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); font: var(--s4)/1 var(--pxb); padding: 8px 14px 6px; border: 4px solid currentColor; border-radius: 6px; pointer-events: none; background: rgba(3,10,8,.75); }
.stamp.ok { color: var(--mint); } .stamp.no { color: var(--red); }

.irow { display: flex; gap: 12px; align-items: center; }
.irow .spr { width: 64px; height: 64px; }
.irow b { display: block; font: var(--s2)/1.1 var(--pxb); font-weight: 400; }
.irow small { font: var(--s1)/1 var(--px); color: var(--dim); text-transform: uppercase; }
.ticket p.desc { margin: 0; font: var(--s1)/1.5 var(--px); }
dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font: var(--s1)/1.2 var(--px); }
dt { color: var(--dim); } dd { margin: 0; text-align: right; }

#death { align-items: center; }
.dcard { width: calc(100% - 28px); max-width: 440px; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-color: var(--red); background: linear-gradient(#2a1418, #140b0d 40%); box-shadow: 0 6px 0 var(--shadow), 0 0 0 6px rgba(255,75,92,.12); }
.dcard h2 { margin: 0; font: var(--s4)/1.05 var(--pxb); font-weight: 400; text-wrap: balance; }
.cause { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.cause b { font: var(--s3)/1 var(--pxb); color: var(--red); font-weight: 400; text-shadow: 0 2px 0 var(--red-deep); }
.cause span { font: var(--s2)/1 var(--pxb); color: var(--amber); }
.dstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.dstats div { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: #0b0809; border: 2px solid #3a1d22; border-radius: 6px; }
.dstats small { font: var(--s1)/1 var(--px); color: var(--dim); }
.dstats b { font: var(--s2)/1 var(--pxb); font-weight: 400; }
.best { margin: 0; font: var(--s1)/1 var(--pxb); color: var(--mint); text-transform: uppercase; letter-spacing: .06em; }

/* Marv, the guide */
#guide { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#guide .hole { position: fixed; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(1,4,3,.62); border: 2px solid var(--mint); transition: all .22s cubic-bezier(.2,.8,.3,1); pointer-events: none; animation: hole 1s steps(2) infinite; }
#guide .hole.none { left: 50% !important; top: 50% !important; width: 0 !important; height: 0 !important; border: 0; }
@keyframes hole { 50% { border-color: var(--mint-deep); } }
