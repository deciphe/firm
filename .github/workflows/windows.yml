# Builds FIRM.exe on a Windows machine every push to main, publishes it as the
# "windows-latest" release, and mirrors it (plus the build log) to the windows-dist branch.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build FIRM.exe
        id: build
        shell: bash
        run: |
          set -o pipefail
          {
            set -ex
            node --version
            npm install --no-save --no-audit --no-fund --no-package-lock esbuild@0.24.0 @fontsource/manrope@5
            node apps/game/build.mjs --desktop
            ls -la apps/desktop/web
            cd apps/desktop
            npx --yes @tauri-apps/cli@2 build --no-bundle
            cd ../..
            cp apps/desktop/src-tauri/target/release/firm.exe FIRM.exe
            ls -la FIRM.exe
          } 2>&1 | tee build.log

      - name: Publish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f FIRM.exe ]; then
            gh release delete windows-latest --yes --cleanup-tag || true
            gh release create windows-latest FIRM.exe --title "FIRM for Windows (latest build)" --notes "Built from ${GITHUB_SHA}. Download FIRM.exe and run it." --prerelease || true
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan windows-dist
          git rm -r -q --cached -f .
          echo "${GITHUB_SHA} ${{ steps.build.outcome }}" > STATUS.txt
          git add -f STATUS.txt build.log
          [ -f FIRM.exe ] && git add -f FIRM.exe
          git commit -q -m "Windows build ${{ steps.build.outcome }} for ${GITHUB_SHA}"
          git push -f origin windows-dist
