# Builds FIRM.exe on a Windows machine every push to main, publishes it as the
# "windows-latest" release, and mirrors it to the windows-dist branch.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build the offline game page
        shell: bash
        run: |
          mkdir -p .ci && cd .ci && npm init -y >/dev/null && npm install --no-audit --no-fund esbuild@0.24.0 @fontsource/manrope@5 && cd ..
          cp -r .ci/node_modules ./node_modules
          node apps/game/build.mjs --desktop

      - name: Build FIRM.exe
        working-directory: apps/desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --no-bundle

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/desktop/src-tauri/target/release/firm.exe FIRM.exe
          ls -la FIRM.exe
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest FIRM.exe --title "FIRM for Windows (latest build)" --notes "Built from ${GITHUB_SHA}. Download FIRM.exe and run it." --prerelease
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan windows-dist
          git rm -r -q --cached .
          git add -f FIRM.exe
          git commit -q -m "FIRM.exe from ${GITHUB_SHA}"
          git push -f origin windows-dist
